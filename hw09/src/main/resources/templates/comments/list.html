<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<h1>Comments</h1>

<div th:if="${error}" style="color: red;" th:text="${error}"></div>

<form th:action="@{/books/{id}/comments(id=${bookId})}" th:object="${comment}" method="post">
    <input type="text" th:field="*{text}" placeholder="New comment" required/>
    <button type="submit">Add</button>
</form>

<ul>
    <li th:each="c : ${comments}">
        <span th:text="${c.text}"></span>
        <form th:action="@{/comments/{id}/delete(id=${c.id})}" method="post" style="display:inline">
            <input type="hidden" name="bookId" th:value="${bookId}"/>
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>

<a th:href="@{/books}">Back to books</a>
</body>
</html>
