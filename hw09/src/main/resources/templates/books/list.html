<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>

<h1>Books</h1>
<a th:href="@{/books/new}">+ Add book</a>

<table border="1">
    <thead>
    <tr><th>ID</th><th>Title</th><th>Author</th><th>Genres</th><th>Actions</th></tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.id}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.author.fullName}"></td>
        <td>
            <span th:each="g : ${book.genres}" th:text="${g.name} + ' '"></span>
        </td>
        <td>
            <a th:href="@{/books/{id}(id=${book.id})}">View</a> |
            <a th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a> |
            <a th:href="@{/books/{id}/delete(id=${book.id})}">Delete</a> |
            <a th:href="@{/books/{id}/comments(id=${book.id})}">Comments</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
